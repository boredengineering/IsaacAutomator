# ==============================================================================
# Isaac Automator - Cloud Robotics Ecosystem Profile (cloud-ecosystem.yaml)
# ==============================================================================
# Reconciles local host physical AI stack (full-ecosystem.yaml) with cloud
# deployment targets (GCP Flex-start RTX PRO 6000 Blackwell Workstation Edition).
# Validated for both 'ansible' (cloud deployment) and 'local' (host execution).
# ==============================================================================
schema_version: v1alpha1
kind: workstation-profile
name: cloud-ecosystem
target: offline
extends: full

components:
  sim:
    enabled: true
    execution: native
    runtime: kit
    source:
      mode: standalone
      version: '6.0.1'
      url: 'https://downloads.isaacsim.nvidia.com/isaac-sim-standalone-6.0.1-linux-x86_64.zip'
      sha256: '348013c4d3ac398d40162566d0edfe4f3837a0eb5efa358ec87065f81aa68dd7'
  lab:
    enabled: true
    execution: native
    runtime: lab
    source:
      mode: git
      repository: 'https://github.com/isaac-sim/IsaacLab.git'
      ref: 'v3.0.0-beta2'
  arena:
    enabled: true
    execution: native
    runtime: lab
    source:
      mode: git
      repository: 'https://github.com/isaac-sim/IsaacLab-Arena.git'
      ref: 'release/0.3.0-prerelease'
  lerobot:
    enabled: true
    execution: native
    runtime: lerobot
    source:
      mode: git
      repository: 'https://github.com/huggingface/lerobot.git'
      ref: 'v0.4.3'
  gr00t:
    enabled: true
    execution: native
    runtime: gr00t
    source:
      mode: git
      repository: 'https://github.com/NVIDIA/Isaac-GR00T.git'
      ref: '51d4c89f72fda44cbf77285c6a8114b52676b8a1'
      revision: '51d4c89f72fda44cbf77285c6a8114b52676b8a1'

workspace:
  root: '~/Documents/GitHub'
  layout: 'flat'

runtimes:
  kit:
    manager: bundled
    environment: kit
  lab:
    manager: conda
    environment: isaaclab
    python: '3.12'
    torch: '2.10.0+cu128'
    cuda_runtime: '12.8'
    architecture: sm_120
  gr00t:
    manager: uv
    environment: gr00t
  lerobot:
    manager: conda
    environment: lerobot

serving:
  enabled: true
  bind: 127.0.0.1
  port: 5561
  embodiment: NEW_EMBODIMENT
  model:
    repository: 'nvidia/GR00T-N1.7-3B'
    ref: 'main'
