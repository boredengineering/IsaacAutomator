# Complete Model Zoo Profile
# Full multi-tier model catalog for physical AI & autonomous robotics workstations:
#   1. Cognitive Specification Synthesizers (Port 8000 / arena-vllm-spec + Colibri Engine)
#   2. Visual Critics, World Models & Geometric Oracles (Port 8001 / arena-vllm-visual + Port 8002 Depth/Normal Daemon)
#   3. Closed-Loop Foundation Robotics Policies (Port 5556 gr00t-server + Port 8008 openpi-server)

schema_version: v1
model_profile_name: complete-model-zoo
description: "Complete Model Zoo (Spec LLMs + Visual/3D Critics + GR00T/OpenPI Closed-Loop Policies)"

defaults:
  provider: huggingface
  download_engine: hf_transfer
  auth_env: HF_TOKEN

storage:
  physical_dir: /mnt/models_fast/models
  logical_mounts:
    - target: /models
      link_to: /mnt/models_fast/models
    - target: ~/models
      link_to: /mnt/models_fast/models
    - target: ~/.cache/huggingface
      link_to: /mnt/models_fast/hf_cache
    - target: ~/.cache/isaac-gr00t
      link_to: /mnt/models_fast/hf_cache
    - target: ~/.cache/openpi
      link_to: /mnt/models_fast/models/openpi
    - target: /mnt/nvme1
      link_to: /mnt/models_fast

models:
  # ===========================================================================
  # 1. Cognitive Specification Synthesizers (Spec LLMs on Port 8000 / GPU 0)
  # ===========================================================================
  - name: qwen2.5-72b-instruct-awq
    description: "72B Dense Transformer (AWQ) — Active Workstation Baseline Anchor (vLLM arena-vllm-spec, Port 8000)"
    repo_id: Qwen/Qwen2.5-72B-Instruct-AWQ
    repo_type: model
    revision: main
    destination: /mnt/models_fast/models/qwen/Qwen2.5-72B-Instruct-AWQ
    symlinks:
      - /models/Qwen2.5-72B-Instruct-AWQ
    allow_patterns:
      - "*.safetensors"
      - "*.json"
      - "*.txt"
      - "tokenizer*"
    min_disk_free_gb: 42

  - name: qwen2.5-coder-32b-instruct-awq
    description: "32B Code-Specialized (AWQ) — Historical Control Baseline (32k/131k YaRN, vLLM arena-vllm-spec)"
