# Colibri Streaming MoE Model Profile
# Full multi-shard layout for high-throughput sequential NVMe streaming.

schema_version: v1
model_profile_name: colibri-streaming
description: "Colibri Streaming MoE layout for dual-drive NVMe host or high-throughput cloud storage"

defaults:
  provider: huggingface
  download_engine: hf_transfer
  auth_env: HF_TOKEN

storage:
  physical_dir: /mnt/models_fast/models
  logical_mounts:
    - target: /models
      link_to: /mnt/models_fast/models
    - target: ~/models
      link_to: /mnt/models_fast/models
    - target: /mnt/nvme1
      link_to: /mnt/models_fast

models:
  - name: glm-5.3-flash
    description: "321B MoE Multimodal (62 shards, ~182 GB)"
    repo_id: zai-org/GLM-5.3-Flash
    repo_type: model
    revision: main
    destination: /mnt/models_fast/models/glm-5.3-flash
    symlinks:
      - /models/glm-5.3-flash
      - /models/glm-5.3
    allow_patterns:
      - "*.safetensors"
      - "*.json"
      - "*.txt"
      - "tokenizer*"
    ignore_patterns:
      - "*.bin"
    min_disk_free_gb: 190

  - name: glm-5.3
    description: "744B MoE Flagship (141 shards, ~419 GB)"
    repo_id: zai-org/GLM-5.3
    repo_type: model
    revision: main
    destination: /mnt/models_fast/models/glm-5.3
    symlinks:
      - /models/glm-5.3
    allow_patterns:
      - "*.safetensors"
      - "*.json"
      - ".coli*"
    ignore_patterns:
      - "*.bin"
    min_disk_free_gb: 440
