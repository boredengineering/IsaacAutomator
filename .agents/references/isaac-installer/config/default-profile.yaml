# ==============================================================================
# Isaac Automator - Standard Interactive Workstation Profile (default-profile.yaml)
# ==============================================================================
# Target: Clean, high-performance Isaac Sim & Isaac Lab interactive workstation.
# Bloat-free: VR gloves, SpaceMouse daemons, LeRobot, and Discord are DISABLED.
# ==============================================================================

version: "1.0"
profile_name: "default-workstation"
description: "Standard clean Isaac Lab & Robotics development workstation"

hardware:
  force_gpu_index: 0
  enforce_x11: true
  auto_blacklist_nouveau: true
  enable_nvme_storage_tools: true

workspace:
  root: "~/Documents/GitHub"
  layout: "auto"                     # "auto" | "org" | "flat"
  default_owner: "BoredEngineer"  # GitHub user / org namespace
  auto_register_github_desktop: true
  auto_create_fork: true             # Automatically create GitHub fork if missing via gh CLI

repositories:
  isaaclab:
    enabled: true
    repo: "boredengineering/IsaacLab"
    upstream: "https://github.com/isaac-sim/IsaacLab.git"
    branch: ""
    tag: "v3.0.0-beta2"                  # Exact pinned tag for Arena 0.3.0 & Isaac Sim 6.0.1
  arena:
    enabled: true
    repo: "boredengineering/IsaacLab-Arena"
    upstream: "https://github.com/isaac-sim/IsaacLab-Arena.git"
    branch: "release/0.3.0-prerelease"
    tag: ""
  lerobot:
    enabled: false                   # Disabled by default; enable in full-ecosystem
    repo: "boredengineering/lerobot"
    upstream: "https://github.com/huggingface/lerobot.git"
    branch: "main"
    tag: "v0.4.3"                    # Pinned stable release
    isolated_env: true               # Run in dedicated 'lerobot' conda env to prevent GR00T/numpy conflicts

simulation:
  isaacsim:
    enabled: true
    version: "6.0.1"                 # "6.0.1" | "5.1.0" | "custom"
    install_dir: "~/IsaacSim"        # Standard standalone directory or custom build
    source_type: "standalone"        # "standalone" | "custom_build" | "omniverse_launcher"
    custom_build:
      enabled: false
      source_path: "~/IsaacSim-Source"
      build_command: "./build.sh -r"
    accept_eula: true

devtools:
  docker: true
  nvidia_container_toolkit: true
  vscode: true
  github_desktop: true
  chromium: true
  discord: false                     # Disabled by default
  cloud_clis:
    aws: false                       # Disabled by default
    gcloud: false                    # Disabled by default
    gh: true

teleoperation:
  ftdi_1ms_latency_rule: true        # Lightweight 1ms FTDI udev rule for arms
  spacemouse_daemon: false           # Disabled (no background spacenavd)
  manus_vr_gloves: false             # Disabled
  realsense_cameras: false           # Disabled
  xr_cloudxr: false                  # Disabled

streaming:
  provider: "none"                   # "none" | "nomachine" | "sunshine"

demos:
  desktop_shortcuts: true
