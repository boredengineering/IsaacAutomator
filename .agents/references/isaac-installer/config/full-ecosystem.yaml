# ==============================================================================
# Isaac Automator - Full Physical AI & Teleoperation Ecosystem (full-ecosystem.yaml)
# ==============================================================================
# Target: Complete Physical AI Lab workstation with LeRobot, Arena, Teleop & Cloud
# ==============================================================================

version: "1.0"
profile_name: "full-ecosystem"
description: "Full Physical AI, Multi-Agent Arena, and Teleoperation Workstation"

hardware:
  force_gpu_index: 0
  enforce_x11: true
  auto_blacklist_nouveau: true
  enable_nvme_storage_tools: true

workspace:
  root: "~/Documents/GitHub"
  layout: "auto"                     # "auto" | "org" | "flat"
  default_owner: "BoredEngineer"
  auto_register_github_desktop: true

repositories:
  isaaclab:
    enabled: true
    repo: "https://github.com/isaac-sim/IsaacLab.git"
    upstream: "https://github.com/isaac-sim/IsaacLab.git"
    branch: "main"
    tag: ""
  arena:
    enabled: true
    repo: "https://github.com/isaac-sim/IsaacLab-Arena.git"
    upstream: "https://github.com/isaac-sim/IsaacLab-Arena.git"
    branch: "release/0.1.1"
    tag: ""
  lerobot:
    enabled: true
    repo: "https://github.com/huggingface/lerobot.git"
    upstream: "https://github.com/huggingface/lerobot.git"
    branch: "main"
    tag: ""

simulation:
  isaacsim:
    enabled: true
    version: "5.1.0"
    install_dir: "~/IsaacSim"
    accept_eula: true

devtools:
  docker: true
  nvidia_container_toolkit: true
  vscode: true
  github_desktop: true
  chromium: true
  discord: true
  cloud_clis:
    aws: true
    gcloud: true
    gh: true

teleoperation:
  ftdi_1ms_latency_rule: true
  spacemouse_daemon: true
  manus_vr_gloves: true
  realsense_cameras: true
  xr_cloudxr: true

streaming:
  provider: "none"                   # Change to "nomachine" or "sunshine" if remote streaming is needed

demos:
  desktop_shortcuts: true
