---
- name: Check if Miniconda is already installed
  stat:
    path: "{{ miniconda_install_dir }}/bin/conda"
  register: miniconda_bin

- name: Download Miniconda installer
  get_url:
    url: "{{ miniconda_installer_url }}"
    dest: "/tmp/miniconda_installer.sh"
    mode: "0755"
  when: not miniconda_bin.stat.exists

- name: Install Miniconda
  shell: "/tmp/miniconda_installer.sh -b -u -p {{ miniconda_install_dir }}"
  become_user: "{{ ansible_user }}"
  when: not miniconda_bin.stat.exists

- name: Remove Miniconda installer
  file:
    path: "/tmp/miniconda_installer.sh"
    state: absent
  when: not miniconda_bin.stat.exists

- name: Initialize Conda for bash
  shell: "{{ miniconda_install_dir }}/bin/conda init bash"
  become_user: "{{ ansible_user }}"
  changed_when: false

- name: Configure Conda ToS auto-accept
  shell: |
    {{ miniconda_install_dir }}/bin/conda config --set auto_activate_base false
    {{ miniconda_install_dir }}/bin/conda config --add channels conda-forge
    {{ miniconda_install_dir }}/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main || true
    {{ miniconda_install_dir }}/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r || true
    {{ miniconda_install_dir }}/bin/conda tos accept --all || true
  environment:
    CONDA_PLUGINS_AUTO_ACCEPT_TOS: "yes"
  become_user: "{{ ansible_user }}"
  changed_when: false
  failed_when: false

- name: Check if named conda environment exists
  shell: "{{ miniconda_install_dir }}/bin/conda env list | grep -E '^({{ conda_env_name }})\\s'"
  become_user: "{{ ansible_user }}"
  register: conda_env_check
  failed_when: false
  changed_when: false

- name: Create named conda environment
  shell: "{{ miniconda_install_dir }}/bin/conda create -y -n {{ conda_env_name }} python={{ conda_python_version }}"
  environment:
    CONDA_PLUGINS_AUTO_ACCEPT_TOS: "yes"
  become_user: "{{ ansible_user }}"
  when: conda_env_check.rc != 0

- name: Install UV for fast pip resolution
  shell: "{{ miniconda_install_dir }}/envs/{{ conda_env_name }}/bin/python -m pip install uv"
  become_user: "{{ ansible_user }}"
  when: enable_uv | bool
  changed_when: false

- name: Require requested GPU architecture before installing profile wheels
  ansible.builtin.assert:
    that:
      - gpu_compute_cap is defined
      - "('sm_' ~ (gpu_compute_cap | string | replace('.', ''))) == profile_lab_architecture"
    fail_msg: "Requested profile GPU architecture does not match observed target; no parity assumed."
  when: profile_lab_architecture is defined

- name: Determine PyTorch wheel channel and spec
  set_fact:
    torch_wheel_channel: "{{ ('https://download.pytorch.org/whl/cu' ~ (profile_lab_cuda_runtime | replace('.', ''))) if profile_lab_cuda_runtime is defined else ('https://download.pytorch.org/whl/cu128' if (gpu_compute_cap is defined and (gpu_compute_cap | float >= 12.0)) else 'https://download.pytorch.org/whl/cu124') }}"
    torch_version_spec: "{{ (('torch==' ~ profile_lab_torch) if profile_lab_torch is defined else ('torch==2.10.0+cu128' if (gpu_compute_cap is defined and (gpu_compute_cap | float >= 12.0)) else 'torch==2.5.1+cu124')) ~ ' ' ~ (('torchvision==' ~ profile_lab_torchvision) if profile_lab_torchvision is defined else 'torchvision') if (profile_lab_torch is defined or profile_lab_torchvision is defined) else ('torch==2.10.0+cu128 torchvision==0.25.0+cu128' if (gpu_compute_cap is defined and (gpu_compute_cap | float >= 12.0)) else 'torch==2.5.1+cu124 torchvision==0.20.1+cu124') }}"

- name: Install hardware-optimized PyTorch wheels
  shell: "{{ miniconda_install_dir }}/envs/{{ conda_env_name }}/bin/python -m pip install {{ torch_version_spec }} --index-url {{ torch_wheel_channel }}"
  become_user: "{{ ansible_user }}"
  changed_when: false

- name: Install reviewed profile Lab dependencies
  ansible.builtin.command:
    argv:
      - "{{ miniconda_install_dir }}/envs/{{ conda_env_name }}/bin/python"
      - -m
      - pip
      - install
      - --
      - "{{ item }}"
  loop: "{{ profile_lab_packages | default([]) }}"
  become_user: "{{ ansible_user }}"
  when: profile_lab_packages is defined

- name: Ensure activation and deactivation hook directories exist
  file:
    path: "{{ miniconda_install_dir }}/envs/{{ conda_env_name }}/etc/conda/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - activate.d
    - deactivate.d

- name: Deploy dynamic Vulkan ICD activation hook
  template:
    src: vulkan_icd.sh.j2
    dest: "{{ miniconda_install_dir }}/envs/{{ conda_env_name }}/etc/conda/activate.d/vulkan_icd.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy PYTHONPATH cleanup deactivation hook
  template:
    src: cleanup_pythonpath.sh.j2
    dest: "{{ miniconda_install_dir }}/envs/{{ conda_env_name }}/etc/conda/deactivate.d/cleanup_pythonpath.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy isaaclab-env CLI shim
  template:
    src: isaaclab-env.j2
    dest: /usr/local/bin/isaaclab-env
    owner: root
    group: root
    mode: "0755"
