---

- name: Ensure results directory exists
  ansible.builtin.file:
    path: "{{ results_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags:
    - on_stop_start
    - __autorun
    - skip_in_image

- name: Install GCP Preemption Listener Daemon
  ansible.builtin.copy:
    src: preempt-listener.py
    dest: /usr/local/bin/preempt-listener.py
    owner: root
    group: root
    mode: "0755"
  when: cloud == "gcp"

- name: Deploy Preemption Listener Service Unit
  ansible.builtin.template:
    src: isaac-preempt-listener.service.j2
    dest: /etc/systemd/system/isaac-preempt-listener.service
    owner: root
    group: root
    mode: "0644"
  when: cloud == "gcp"
  notify: Reload Systemd

- name: Enable and Start Preemption Listener
  ansible.builtin.systemd:
    name: isaac-preempt-listener.service
    state: started
    enabled: true
    daemon_reload: true
  when: cloud == "gcp"
  tags:
    - skip_in_image
    - on_stop_start

- name: Deploy GCS Backup Service and Timer
  when: cloud == "gcp" and gcs_backup_bucket is defined and gcs_backup_bucket | length > 0
  block:
    - name: Deploy GCS Backup Service Unit
      ansible.builtin.template:
        src: isaac-backup.service.j2
        dest: /etc/systemd/system/isaac-backup.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload Systemd

    - name: Deploy GCS Backup Timer Unit
      ansible.builtin.template:
        src: isaac-backup.timer.j2
        dest: /etc/systemd/system/isaac-backup.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload Systemd

    - name: Enable and Start GCS Backup Timer
      ansible.builtin.systemd:
        name: isaac-backup.timer
        state: started
        enabled: true
        daemon_reload: true
      tags:
        - skip_in_image
        - on_stop_start

    - name: Auto-Restore from GCS on First Boot
      ansible.builtin.command: >
        gcloud storage rsync gs://{{ gcs_backup_bucket }}/{{ deployment_name }}/results/ {{ results_dir }} --recursive
      become_user: "{{ ansible_user }}"
      register: restore_result
      changed_when: restore_result.rc == 0
      failed_when: false
      when: gcs_auto_restore | default(false) | bool
      tags:
        - skip_in_image
