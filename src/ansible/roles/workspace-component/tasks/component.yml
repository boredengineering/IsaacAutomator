---
- name: "Manage Git source for component: {{ current_component.id }}"
  ansible.builtin.include_tasks: git.yml
  when: (current_component.type | default('git')) == 'git'

- name: "Install dependencies and environment binding for component: {{ current_component.id }}"
  ansible.builtin.include_tasks: install.yml
  when: (current_component.install_method | default('editable')) != 'none'

- name: "Deploy desktop launcher for component: {{ current_component.id }}"
  ansible.builtin.include_tasks: desktop.yml
  when: current_component.desktop_shortcut is defined and current_component.desktop_shortcut
