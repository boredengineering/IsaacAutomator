---
- name: "Check if isaaclab-env CLI shim is available"
  ansible.builtin.stat:
    path: /usr/local/bin/isaaclab-env
  register: component_isaaclab_env_bin

- name: "Check if uv CLI is available"
  ansible.builtin.stat:
    path: /usr/local/bin/uv
  register: component_uv_bin

- name: "Install {{ current_component.id }} in editable mode"
  when: (current_component.install_method | default('editable')) == 'editable'
  block:
    - name: "Run editable pip install inside Isaac Lab environment"
      ansible.builtin.shell: >
        /usr/local/bin/isaaclab-env pip install -e . 2>&1 | tee {{ workspace_component_log_dir | default('/tmp') }}/{{ current_component.id }}-install.log
      args:
        chdir: "{{ current_component.dest }}"
      become_user: "{{ ansible_user }}"
      when: (current_component.runtime | default('lab')) == 'lab' and component_isaaclab_env_bin.stat.exists
      async: 1800
      poll: 15

    - name: "Run editable pip install inside uv environment"
      ansible.builtin.shell: >
        /usr/local/bin/uv pip install -e . 2>&1 | tee {{ workspace_component_log_dir | default('/tmp') }}/{{ current_component.id }}-install.log
      args:
        chdir: "{{ current_component.dest }}"
      become_user: "{{ ansible_user }}"
      when: (current_component.runtime | default('lab')) == 'gr00t' and component_uv_bin.stat.exists
      async: 1800
      poll: 15

- name: "Install {{ current_component.id }} in standard mode"
  when: (current_component.install_method | default('editable')) == 'standard'
  block:
    - name: "Run standard pip install inside Isaac Lab environment"
      ansible.builtin.shell: >
        /usr/local/bin/isaaclab-env pip install . 2>&1 | tee {{ workspace_component_log_dir | default('/tmp') }}/{{ current_component.id }}-install.log
      args:
        chdir: "{{ current_component.dest }}"
      become_user: "{{ ansible_user }}"
      when: (current_component.runtime | default('lab')) == 'lab' and component_isaaclab_env_bin.stat.exists
      async: 1800
      poll: 15

- name: "Execute custom script install for {{ current_component.id }}"
  ansible.builtin.shell: "{{ current_component.install_command }}"
  args:
    chdir: "{{ current_component.dest }}"
  become_user: "{{ ansible_user }}"
  when: >
    (current_component.install_method | default('editable')) == 'script' and
    current_component.install_command is defined and
    (current_component.install_command | length > 0)
  async: 1800
  poll: 15
