---
- name: "Create destination parent directory for {{ current_component.id }}"
  ansible.builtin.file:
    path: "{{ current_component.dest | dirname }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: "Check if repository already exists for {{ current_component.id }}"
  ansible.builtin.stat:
    path: "{{ current_component.dest }}/.git"
  register: component_git_stat

- name: "Securely check out {{ current_component.id }} via public-git"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/public-git/tasks/source.yml"
  vars:
    public_git_repository: "{{ current_component.repository }}"
    public_git_ref: "{{ current_component.ref }}"
    public_git_destination: "{{ current_component.dest }}"
    public_git_allow_submodules: "{{ current_component.submodules | default(true) | bool }}"
  when: (not component_git_stat.stat.exists) and (public_git_profile | default(false) | bool)

- name: "Clone {{ current_component.id }} via git module fallback"
  ansible.builtin.git:
    repo: "{{ current_component.repository }}"
    dest: "{{ current_component.dest }}"
    version: "{{ current_component.ref }}"
    force: true
  become_user: "{{ ansible_user }}"
  when: (not component_git_stat.stat.exists) and not (public_git_profile | default(false) | bool)

- name: "Mark {{ current_component.id }} repository as safe directory in git config"
  community.general.git_config:
    name: safe.directory
    value: "{{ current_component.dest }}"
    scope: global
  become_user: "{{ ansible_user }}"

- name: "Configure upstream tracking remote for {{ current_component.id }}"
  community.general.git_config:
    name: remote.upstream.url
    value: "{{ current_component.upstream }}"
    repo: "{{ current_component.dest }}"
    scope: local
  become_user: "{{ ansible_user }}"
  when: >
    current_component.upstream is defined and
    (current_component.upstream | length > 0) and
    (current_component.upstream != current_component.repository)

- name: "Fetch origin branches and configure tracking branches for {{ current_component.id }}"
  ansible.builtin.shell: |
    set -e
    git -C "{{ current_component.dest }}" fetch origin '+refs/heads/*:refs/remotes/origin/*' || true
    {% set target_branches = ([current_component.ref, 'main', 'renan-dev'] + (current_component.branches | default([]))) | unique | reject('in', ['', 'none', 'no']) %}
    {% for branch in target_branches %}
    if git -C "{{ current_component.dest }}" rev-parse --verify "refs/remotes/origin/{{ branch }}" >/dev/null 2>&1; then
      if ! git -C "{{ current_component.dest }}" rev-parse --verify "refs/heads/{{ branch }}" >/dev/null 2>&1; then
        git -C "{{ current_component.dest }}" branch --track "{{ branch }}" "origin/{{ branch }}" || true
      fi
    fi
    {% endfor %}
    if [ -n "{{ current_component.ref }}" ] && git -C "{{ current_component.dest }}" rev-parse --verify "refs/heads/{{ current_component.ref }}" >/dev/null 2>&1; then
      git -C "{{ current_component.dest }}" checkout "{{ current_component.ref }}" || true
    fi
  become_user: "{{ ansible_user }}"
  ignore_errors: true
