---
# Native-only source, environment, launcher and desktop provisioning.
- name: Select isolated fresh profile Git source
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/public-git/tasks/source.yml"
  vars:
    public_git_repository: "{{ gr00t_git_repo }}"
    public_git_ref: "{{ gr00t_git_checkpoint }}"
    public_git_destination: "{{ gr00t_dir }}"
  when: public_git_profile | default(false) | bool

- name: Install system dependencies for Isaac-GR00T
  apt:
    name:
      - git-lfs
      - ffmpeg
      - pkg-config
    state: present

- name: Ensure git-lfs is initialized for user
  shell: git lfs install --skip-repo 2>/dev/null || true
  become_user: "{{ ansible_user }}"
  changed_when: false
  when: not (public_git_profile | default(false) | bool)

- name: Create parent directories for Isaac-GR00T
  file:
    path: "{{ gr00t_dir | dirname }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Check if Isaac-GR00T repository exists
  stat:
    path: "{{ gr00t_dir }}/.git"
  register: gr00t_repo_stat

- name: Clone Isaac-GR00T repository
  git:
    repo: "{{ gr00t_git_repo }}"
    dest: "{{ gr00t_dir }}"
    version: "{{ gr00t_git_checkpoint }}"
    force: true
  become_user: "{{ ansible_user }}"
  when: (not gr00t_repo_stat.stat.exists) and not (public_git_profile | default(false) | bool)

- name: Configure upstream remote for Isaac-GR00T
  git_config:
    name: remote.upstream.url
    value: "{{ gr00t_upstream_repo }}"
    repo: "{{ gr00t_dir }}"
    scope: local
  become_user: "{{ ansible_user }}"
  when: (gr00t_git_repo != gr00t_upstream_repo) and not (public_git_profile | default(false) | bool)

- name: Set branch pushRemote to origin
  git_config:
    name: "branch.{{ gr00t_git_checkpoint }}.pushRemote"
    value: "origin"
    repo: "{{ gr00t_dir }}"
    scope: local
  become_user: "{{ ansible_user }}"
  ignore_errors: true
  when: not (public_git_profile | default(false) | bool)

- name: Update submodules and pull LFS objects
  shell: |
    git submodule update --init --recursive 2>/dev/null || true
    git lfs pull 2>/dev/null || true
  args:
    chdir: "{{ gr00t_dir }}"
  become_user: "{{ ansible_user }}"
  changed_when: false
  when: not (public_git_profile | default(false) | bool)

- name: Check if isaaclab-env is available
  stat:
    path: /usr/local/bin/isaaclab-env
  register: isaaclab_env_bin

- name: Install Isaac-GR00T dependencies into isaaclab environment
  shell: /usr/local/bin/isaaclab-env pip install -e . 2>&1 | tee /tmp/gr00t-install.log
  args:
    chdir: "{{ gr00t_dir }}"
  become_user: "{{ ansible_user }}"
  when: isaaclab_env_bin.stat.exists and not (profile_gr00t_isolated | default(false) | bool)
  async: 1800
  poll: 15

# uv is a tool provisioned by the earlier conda role, not GR00T's interpreter.
# Its project environment must never resolve to the Lab environment.
- name: Sync isolated profile GR00T environment
  ansible.builtin.command:
    argv:
      - "{{ miniconda_install_dir }}/envs/{{ conda_env_name }}/bin/uv"
      - sync
    chdir: "{{ gr00t_dir }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ gr00t_dir }}/.venv"
    PYTHONPATH: ""
    PYTHONHOME: ""
    VIRTUAL_ENV: ""
    CONDA_PREFIX: ""
  become_user: "{{ ansible_user }}"
  when: profile_gr00t_isolated | default(false) | bool
  async: 1800
  poll: 15

- name: Ensure cache directory exists for model weights
  file:
    path: "{{ gr00t_cache_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy Isaac-GR00T policy server launcher script
  template:
    src: gr00t-policy-server.sh.j2
    dest: "{{ gr00t_dir }}/gr00t-policy-server.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Check if Desktop directory exists
  stat:
    path: "/home/{{ ansible_user }}/Desktop"
  register: desktop_dir_stat

- name: Deploy Isaac-GR00T Desktop shortcut
  template:
    src: Isaac-GR00T-Server.desktop.j2
    dest: "/home/{{ ansible_user }}/Desktop/Isaac-GR00T-Server.desktop"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: desktop_dir_stat.stat.exists

- name: Trust Isaac-GR00T Desktop shortcut
  shell: gio set "/home/{{ ansible_user }}/Desktop/Isaac-GR00T-Server.desktop" metadata::trusted true
  become_user: "{{ ansible_user }}"
  ignore_errors: true
  when: desktop_dir_stat.stat.exists
