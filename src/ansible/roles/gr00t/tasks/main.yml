---
- name: Check whether a validated registry image selects GR00T
  ansible.builtin.set_fact:
    gr00t_registry_selected: >-
      {{ ((artifact_registry_validated | default({})).get('enabled', false)
          and 'gr00t' in (artifact_registry_validated | default({})).get('images', {}))
         or ((container_registry_validated | default({})).get('enabled', false)
             and (container_registry_validated | default({})).get('provider') in ['aws_ecr', 'dockerhub']
             and 'gr00t' in (container_registry_validated | default({})).get('images', {})) }}
    gr00t_generic_registry_selected: >-
      {{ (container_registry_validated | default({})).get('enabled', false)
         and (container_registry_validated | default({})).get('provider') in ['aws_ecr', 'dockerhub']
         and 'gr00t' in (container_registry_validated | default({})).get('images', {}) }}

- name: Resolve GR00T installation and serving mode
  ansible.builtin.set_fact:
    should_install_gr00t: "{{ gr00t_registry_selected or (install_gr00t | default(false) | bool) }}"
    gr00t_effective_serving_mode: "{{ 'container' if gr00t_registry_selected else gr00t_serving_mode }}"

- name: Require generic registry prerequisites before any GR00T service changes
  ansible.builtin.assert:
    that:
      - container_registry_root_docker_config is defined
      - container_registry_root_docker_config is string
      - container_registry_root_docker_config | length > 0
    fail_msg: >-
      GR00T requires container-registry authentication and image preparation in this invocation.
      Run the full play or use --tags __container_registry,__gr00t so registry prerequisites
      complete before any service changes; --tags __gr00t alone is not sufficient.
    quiet: true
  when: gr00t_generic_registry_selected

- name: Retire the container service before explicit native provisioning
  when: should_install_gr00t and gr00t_effective_serving_mode == 'native'
  block:
    - name: Discover an existing container GR00T service
      ansible.builtin.service_facts:

    - name: Stop and disable the container service before native mode
      ansible.builtin.systemd:
        name: isaac-gr00t-container
        enabled: false
        state: stopped
      when: "'isaac-gr00t-container.service' in ansible_facts.services"

- name: Provision the native GR00T source and environment only in native mode
  ansible.builtin.include_tasks: native.yml
  when: should_install_gr00t and gr00t_effective_serving_mode == 'native'

- name: Deploy Isaac-GR00T native systemd service
  ansible.builtin.template:
    src: isaac-gr00t.service.j2
    dest: /etc/systemd/system/isaac-gr00t.service
    mode: "0644"
  when: should_install_gr00t and (gr00t_service_enabled | bool) and gr00t_effective_serving_mode == 'native'
  notify: reload_systemd

- name: Configure the GR00T container service
  when: should_install_gr00t and (gr00t_registry_selected or (gr00t_service_enabled | bool)) and gr00t_effective_serving_mode == 'container'
  block:
    - name: Discover an existing native GR00T service
      ansible.builtin.service_facts:

    - name: Stop and disable the native service before container mode
      ansible.builtin.systemd:
        name: isaac-gr00t
        enabled: false
        state: stopped
      when: "'isaac-gr00t.service' in ansible_facts.services"

    - name: Deploy Isaac-GR00T containerized systemd service
      ansible.builtin.template:
        src: isaac-gr00t-container.service.j2
        dest: /etc/systemd/system/isaac-gr00t-container.service
        mode: "0644"
      notify: restart_gr00t_container

    - name: Enable and start the GR00T container service
      ansible.builtin.systemd:
        name: isaac-gr00t-container
        enabled: true
        state: started
        daemon_reload: true
