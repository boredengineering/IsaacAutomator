---
# Enable/disable GR00T foundation model stack installation
install_gr00t: false

gr00t_org: boredengineering
gr00t_dir: "/home/{{ ansible_user }}/Documents/GitHub/{{ gr00t_org }}/Isaac-GR00T"
gr00t_git_repo: "https://github.com/{{ gr00t_org }}/Isaac-GR00T.git"
gr00t_upstream_repo: "https://github.com/NVIDIA/Isaac-GR00T.git"
gr00t_git_checkpoint: main
gr00t_port: 5556
gr00t_model_path: "nvidia/GR00T-N1.7-3B"
gr00t_vlm_backbone: "nvidia/Cosmos-Reason2-2B"
gr00t_cache_dir: "/home/{{ ansible_user }}/.cache/isaac-gr00t"
gr00t_service_enabled: true
gr00t_device: "cuda:0"
gr00t_embodiment_tag: "OXE_DROID_RELATIVE_EEF_RELATIVE_JOINT"
