---
# Install and configure GitHub Desktop for Linux via Shiftkey / MWT package feed

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Download Shiftkey / MWT GPG key
  ansible.builtin.get_url:
    url: https://mirror.mwt.me/shiftkey-desktop/gpgkey
    dest: /tmp/mwt-desktop.gpg.raw
    mode: "0644"

- name: Dearmor Shiftkey / MWT GPG key
  ansible.builtin.shell: >
    cat /tmp/mwt-desktop.gpg.raw | gpg --dearmor --yes -o /usr/share/keyrings/mwt-desktop.gpg
  args:
    creates: /usr/share/keyrings/mwt-desktop.gpg

- name: Set permissions on MWT GPG keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/mwt-desktop.gpg
    mode: "0644"
    owner: root
    group: root

- name: Configure Shiftkey / MWT APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/mwt-desktop.gpg] https://mirror.mwt.me/shiftkey-desktop/deb/ any main"
    filename: mwt-desktop
    state: present
    update_cache: yes

- name: Install GitHub Desktop package
  ansible.builtin.apt:
    name: github-desktop
    state: present

- name: Make sure desktop directory exists
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/Desktop
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Create desktop shortcut for GitHub Desktop
  ansible.builtin.copy:
    dest: /home/{{ ansible_user }}/Desktop/github-desktop.desktop
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    content: |
      [Desktop Entry]
      Version=1.0
      Type=Application
      Name=GitHub Desktop
      GenericName=Git Client
      Comment=GUI for managing Git and GitHub repositories
      Exec=github-desktop %U
      Icon=github-desktop
      StartupWMClass=GitHub Desktop
      Terminal=false
      Categories=Development;RevisionControl;

- name: Allow execution of desktop icon for GitHub Desktop
  ansible.builtin.shell: >
    gio set "/home/{{ ansible_user }}/Desktop/github-desktop.desktop" metadata::trusted true
  become_user: "{{ ansible_user }}"
  ignore_errors: true
