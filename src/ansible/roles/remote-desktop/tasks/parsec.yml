---
# Install Parsec Linux daemon for ultra-low latency interactive streaming

- name: Install Parsec prerequisites
  apt:
    name:
      - libgl1-mesa-dri
      - libva2
      - curl
    state: present
    update_cache: yes

- name: Download Parsec Linux package
  get_url:
    url: "{{ parsec_deb_url }}"
    dest: "{{ parsec_deb_path }}"
    mode: "0644"
    timeout: 300
    force: false

- name: Install Parsec package
  apt:
    deb: "{{ parsec_deb_path }}"
    state: present

- name: Ensure Parsec user config directory exists
  file:
    path: "/home/{{ ansible_user }}/.parsec"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Write Parsec configuration if server key is provided
  copy:
    dest: "/home/{{ ansible_user }}/.parsec/config.txt"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    content: |
      server_key = {{ parsec_server_key }}
      host_name = {{ deployment_name }}
  when: parsec_server_key | default('') != ''
