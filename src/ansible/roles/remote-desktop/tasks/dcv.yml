---
# Install and configure NICE DCV server for hardware-accelerated GPU desktop streaming

- name: Add NICE DCV GPG key
  apt_key:
    url: "https://d1c2596061whyc.cloudfront.net/NICE-GPG-KEY"
    state: present

- name: Add NICE DCV repository
  apt_repository:
    repo: "deb https://d1c2596061whyc.cloudfront.net/{{ ansible_distribution_release }} {{ ansible_distribution_release }} main"
    state: present
    filename: nice-dcv

- name: Install NICE DCV server packages
  apt:
    name:
      - nice-dcv-server
      - nice-xdcv
    state: present
    update_cache: yes

- name: Enable DCV GPU acceleration (dcv-gl)
  command: dcvgladmin enable
  register: dcvgl_result
  changed_when: "'already enabled' not in dcvgl_result.stdout"
  failed_when: false

- name: Configure NICE DCV (/etc/dcv/dcv.conf)
  template:
    src: dcv.conf.j2
    dest: /etc/dcv/dcv.conf
    mode: "0644"
    owner: root
    group: root

- name: Ensure dcvserver service is enabled and started
  systemd:
    name: dcvserver
    enabled: yes
    state: restarted

- name: Add automatic DCV session creation service
  copy:
    dest: /etc/systemd/system/dcv-session.service
    mode: "0644"
    content: |
      [Unit]
      Description=NICE DCV Automatic Console Session
      After=dcvserver.service
      Requires=dcvserver.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/dcv create-session --owner {{ ansible_user }} --user {{ ansible_user }} console-session
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

- name: Enable and start DCV session service
  systemd:
    name: dcv-session
    daemon_reload: yes
    enabled: yes
    state: restarted
