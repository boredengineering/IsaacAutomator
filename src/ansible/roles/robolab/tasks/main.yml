---
- name: Check if RoboLab installation is requested
  set_fact:
    should_install_robolab: "{{ (install_robolab | default(false) | bool) or (robolab_git_checkpoint | default('no') != 'no') }}"

- name: Install RoboLab Simulation Benchmark Framework
  when: should_install_robolab
  block:
    - name: Select isolated fresh profile Git source
      ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/public-git/tasks/source.yml"
      vars:
        public_git_repository: "{{ robolab_git_repo }}"
        public_git_ref: "{{ robolab_git_checkpoint }}"
        public_git_destination: "{{ robolab_dir }}"
        public_git_allow_submodules: true
      when: public_git_profile | default(false) | bool

    - name: Create parent directories for RoboLab
      file:
        path: "{{ robolab_dir | dirname }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Check if RoboLab repository exists
      stat:
        path: "{{ robolab_dir }}/.git"
      register: robolab_repo_stat

    - name: Clone RoboLab repository
      git:
        repo: "{{ robolab_git_repo }}"
        dest: "{{ robolab_dir }}"
        version: "{{ robolab_git_checkpoint }}"
        force: true
      become_user: "{{ ansible_user }}"
      when: (not robolab_repo_stat.stat.exists) and not (public_git_profile | default(false) | bool)

    - name: Configure upstream remote for RoboLab
      git_config:
        name: remote.upstream.url
        value: "{{ robolab_upstream_repo }}"
        repo: "{{ robolab_dir }}"
        scope: local
      become_user: "{{ ansible_user }}"
      when: (robolab_git_repo != robolab_upstream_repo) and not (public_git_profile | default(false) | bool)

    - name: Check if isaaclab-env is available
      stat:
        path: /usr/local/bin/isaaclab-env
      register: isaaclab_env_bin

    - name: Install RoboLab in editable mode into isaaclab environment
      shell: /usr/local/bin/isaaclab-env pip install -e . 2>&1 | tee /tmp/robolab-install.log
      args:
        chdir: "{{ robolab_dir }}"
      become_user: "{{ ansible_user }}"
      when: isaaclab_env_bin.stat.exists
      async: 1800
      poll: 15

    - name: Check if Desktop directory exists
      stat:
        path: "/home/{{ ansible_user }}/Desktop"
      register: desktop_dir_stat

    - name: Deploy RoboLab Dashboard Desktop shortcut
      template:
        src: RoboLab-Dashboard.desktop.j2
        dest: "/home/{{ ansible_user }}/Desktop/RoboLab-Dashboard.desktop"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      when: desktop_dir_stat.stat.exists

    - name: Trust RoboLab Dashboard Desktop shortcut
      shell: gio set "/home/{{ ansible_user }}/Desktop/RoboLab-Dashboard.desktop" metadata::trusted true
      become_user: "{{ ansible_user }}"
      ignore_errors: true
      when: desktop_dir_stat.stat.exists
