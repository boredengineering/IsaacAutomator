- name: Select isolated fresh profile Git source
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/public-git/tasks/source.yml"
  vars:
    public_git_repository: "{{ isaaclab_git_repo }}"
    public_git_ref: "{{ isaaclab_git_checkpoint }}"
    public_git_destination: "{{ isaaclab_dir }}"
  when: public_git_profile | default(false) | bool

- name: Select explicit Lab pin pipeline
  ansible.builtin.set_fact:
    profile_lab_pins_selected: "{{ profile_lab_torch is defined or profile_lab_torchvision is defined or profile_lab_cuda_runtime is defined or profile_lab_architecture is defined }}"

- name: Create Isaac Lab directory
  file:
    path: "{{ isaaclab_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: 0755

- name: Check existing install tag
  ansible.builtin.command:
    argv:
      - cat
      - --
      - "{{ isaaclab_dir }}/.install-tag"
  register: isaaclab_install_tag
  changed_when: false
  failed_when: false

- name: Clone Isaac Lab repository
  git:
    repo: "{{ isaaclab_git_repo }}"
    dest: "{{ isaaclab_dir }}"
    version: "{{ isaaclab_git_checkpoint }}"
    force: true
    depth: 1
  become_user: "{{ ansible_user }}"
  when: (isaaclab_install_tag.stdout | trim == '') and not (public_git_profile | default(false) | bool)

- name: Get current commit hash
  shell: >-
    /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent
    GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_GLOBAL=/dev/null
    GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git -c core.hooksPath=/dev/null rev-parse HEAD
  args:
    chdir: "{{ isaaclab_dir }}"
  become_user: "{{ ansible_user }}"
  register: isaaclab_current_commit
  changed_when: false

- name: Set isaaclab_install_needed flag
  set_fact:
    isaaclab_install_needed: "{{ (isaaclab_install_tag.stdout | trim) != isaaclab_current_commit.stdout }}"

- name: Debug isaaclab_install_needed
  debug:
    msg: "isaaclab_install_needed: {{ isaaclab_install_needed }} (current: {{ isaaclab_current_commit.stdout }}, tag: {{ isaaclab_install_tag.stdout | default('none', true) }})"

- name: Configure upstream remote for Isaac Lab
  git_config:
    name: remote.upstream.url
    value: "{{ isaaclab_upstream_repo }}"
    repo: "{{ isaaclab_dir }}"
    scope: local
  become_user: "{{ ansible_user }}"
  when: (isaaclab_git_repo != isaaclab_upstream_repo and isaaclab_install_needed) and not (public_git_profile | default(false) | bool)
  ignore_errors: true

- name: Set branch pushRemote to origin
  git_config:
    name: "branch.{{ isaaclab_git_checkpoint }}.pushRemote"
    value: "origin"
    repo: "{{ isaaclab_dir }}"
    scope: local
  become_user: "{{ ansible_user }}"
  when: (isaaclab_install_needed) and not (public_git_profile | default(false) | bool)
  ignore_errors: true

- name: Check if Isaac Sim source directory exists
  stat:
    path: "{{ isaacsim_install_dir }}"
  register: isaacsim_dir_stat

- name: Create symlink to Isaac Sim
  file:
    src: "{{ isaacsim_install_dir }}"
    dest: "{{ isaaclab_dir }}/_isaac_sim"
    state: link
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: isaacsim_dir_stat.stat.exists

- name: Warn if Isaac Sim is not available
  debug:
    msg: "WARNING: Isaac Sim source directory {{ isaacsim_install_dir }} not found. Skipping _isaac_sim symlink."
  when: not isaacsim_dir_stat.stat.exists

- name: Check if isaaclab conda environment or shim exists
  stat:
    path: /usr/local/bin/isaaclab-env
  register: isaaclab_env_check

- name: Install source dependencies with selected Lab pins
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/isaaclab-source/tasks/pinned.yml"
  vars:
    profile_lab_install_kind: lab
  when: profile_lab_pins_selected | bool

- name: Install Isaac Lab into conda environment
  shell: ./isaaclab.sh --conda {{ conda_env_name }} 2>&1 | tee /tmp/isaaclab-install.log
  args:
    chdir: "{{ isaaclab_dir }}"
  become_user: "{{ ansible_user }}"
  async: 3600
  poll: 30
  when: (isaaclab_install_needed and isaaclab_env_check.stat.exists) and not (profile_lab_pins_selected | bool)

- name: Install Isaac Lab standalone (fallback)
  shell: ./isaaclab.sh --install 2>&1 | tee /tmp/isaaclab-install.log
  args:
    chdir: "{{ isaaclab_dir }}"
  become_user: "{{ ansible_user }}"
  async: 3600
  poll: 30
  when: (isaaclab_install_needed and not isaaclab_env_check.stat.exists) and not (profile_lab_pins_selected | bool)

- name: Write install tag
  copy:
    content: "{{ isaaclab_current_commit.stdout }}"
    dest: "{{ isaaclab_dir }}/.install-tag"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: isaaclab_install_needed
