- name: Create demos directory
  file:
    path: "{{ demos_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Ensure Desktop directory exists
  file:
    path: "/home/{{ ansible_user }}/Desktop"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Install Humanoid Locomotion launcher script
  template:
    src: humanoid-locomotion.sh.j2
    dest: "{{ demos_dir }}/humanoid-locomotion.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Install Humanoid Locomotion desktop shortcut
  template:
    src: humanoid-locomotion.desktop.j2
    dest: "/home/{{ ansible_user }}/Desktop/Humanoid-Locomotion-RL.desktop"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# Mark the shortcut trusted so the desktop launches it without a prompt.
# Needs a session bus, which may be absent at provision time; the shortcut
# still works after login, so a failure here must not break the deploy.
- name: Trust the desktop shortcut
  shell: gio set "/home/{{ ansible_user }}/Desktop/Humanoid-Locomotion-RL.desktop" metadata::trusted true
  become_user: "{{ ansible_user }}"
  ignore_errors: true
