# Parse the comma separated --demos list once; "no"/empty means install nothing.
- name: Build list of selected demos
  set_fact:
    selected_demos: "{{ (demos | default('no')).split(',') | map('trim') | reject('in', ['', 'no', 'none']) | list }}"

- name: Install Quadruped Locomotion RL demo
  import_tasks: quadruped-locomotion.yml
  when: "'quadruped-locomotion' in selected_demos"
  tags: __demos_quadruped_locomotion
